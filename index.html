<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Học tiếng Hàn từ con số 0: bảng chữ Hangul, phát âm, ngữ pháp, giao tiếp TOPIK 1–4.">
<title>Jogeum Ssik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Jua&family=Gowun+Dodum&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow app column, like a pocket phrasebook — 3 tracks (giao tiếp / phát âm / ngữ pháp), each a list of lessons */
/* Pastel pink & sky blue: blush ground with soft dots, rose accent, sky-blue secondary */
:root{
  --bg:#EEF6FD; --dot:#D3E7F8; --surface:#FFFFFF; --ink:#1F2F45; --muted:#647A93; --line:#D2E3F3;
  --accent:#E05A68; --accent-soft:#FDE3E6; --hint:#3E8CCB; --hint-soft:#DCEEFC; --butter:#FFE9B8;
  --red:#B5303F; --red-soft:#FBE0E3; --good:#2E8B5B; --good-soft:#DDF2E6; --amber:#D9902B; --lav:#8A6CCB; --petal:#F6B7BE; --shadow:#CFE2F3;
  --display:"Baloo 2", "Jua", "Gowun Dodum", "Noto Sans KR", "Be Vietnam Pro", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121C29; --dot:#1A2738; --surface:#1B2A3C; --ink:#E8F1FB; --muted:#9DB3CC; --line:#2A3E56;
  --accent:#FF8E98; --accent-soft:#4A2329; --hint:#8EC5F2; --hint-soft:#1D3247; --butter:#6E5A33;
  --red:#FF7D8A; --red-soft:#47222A; --good:#6FD39A; --good-soft:#173A28; --amber:#F2B45A; --lav:#B9A2FF; --petal:#7A3C47; --shadow:#0B121B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121C29; --dot:#1A2738; --surface:#1B2A3C; --ink:#E8F1FB; --muted:#9DB3CC; --line:#2A3E56;
  --accent:#FF8E98; --accent-soft:#4A2329; --hint:#8EC5F2; --hint-soft:#1D3247; --butter:#6E5A33;
  --red:#FF7D8A; --red-soft:#47222A; --good:#6FD39A; --good-soft:#173A28; --amber:#F2B45A; --lav:#B9A2FF; --petal:#7A3C47; --shadow:#0B121B; color-scheme:dark}

/* illustrations */
.ill{display:block;flex:none;overflow:visible}
.ill .ia{fill:var(--accent)} .ill .is{fill:var(--accent-soft)} .ill .ih{fill:var(--hint)} .ill .ihs{fill:var(--hint-soft)}
.ill .iw{fill:var(--surface)} .ill .iy{fill:var(--butter)} .ill .ikf{fill:var(--ink)}
.ill .ik,.ill .ik *{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ill .ikh{fill:none;stroke:var(--hint);stroke-width:2.6;stroke-linecap:round}
.ill .iws{fill:none;stroke:var(--surface);stroke-width:2.6;stroke-linecap:round}
.ill .isk ellipse{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2.4}
.ill .ring{fill:none;stroke:var(--accent);stroke-width:12;stroke-dasharray:13.35 13.35}
.ill .itx text{font-family:var(--display);font-weight:800;font-size:17px;fill:var(--ink);text-anchor:middle}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 2px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fr{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
p{margin:0}

header.hero{background:var(--accent-soft);border-radius:26px;padding:20px 20px 0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.themebar{align-self:flex-end;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:4px}
.themebar button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.themebar svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themebar button[aria-checked="true"]{background:var(--accent);color:var(--surface)}
.hero-art{width:100%;max-width:340px;height:auto;margin:6px auto 0;aspect-ratio:300/140}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1;margin:0;letter-spacing:-.03em}
h1 span{color:var(--accent)}
.sub{color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}

.daily{background:var(--accent);color:var(--surface);border:0;border-radius:20px;padding:12px 14px 12px 18px;box-shadow:0 6px 0 var(--line);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}
.daily b{display:block;font-size:1.05rem}
.daily small{opacity:.85}
.daily .ill .ik,.daily .ill .ik *{stroke:var(--ink)}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:.88rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button small{font-weight:500;font-size:.72rem;font-variant-numeric:tabular-nums}
.seg button{gap:2px}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.track-note{font-size:.88rem;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.lesson{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 14px 10px 10px}
.lesson:hover{border-color:var(--accent)}
.tile{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center}
.list li:nth-child(even) .tile{background:var(--hint-soft)}
.bn{display:block;font-size:.72rem;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.08em}
.lesson .t{min-width:0}
.lesson .t .fr{font-size:1.12rem;display:block}
.lesson .t small{color:var(--muted)}
.chip{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.try{background:var(--red-soft);color:var(--red)}

.back{background:none;border:0;color:var(--muted);padding:0;font-weight:600;align-self:flex-start}
.kicker{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hint)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.lhead>div{min-width:0}
.lart{width:76px;height:76px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.lhead h2{font-family:var(--display);font-weight:800;font-size:2rem;margin:2px 0 0;line-height:1.1;text-wrap:balance}
.lhead p{margin-top:4px;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

.stack{display:flex;flex-direction:column;gap:12px}
.tip{background:var(--hint-soft);border-radius:18px;padding:12px 14px;font-size:.93rem}
.tip b{color:var(--hint)}
.note{font-size:.85rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.phrase{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.phrase .fr{font-size:1.3rem;line-height:1.25;min-width:0}
.pr{color:var(--hint);font-size:.9rem;font-weight:500}
.vi{color:var(--muted);font-size:.95rem}
.phrase .btns{grid-row:1 / span 3;grid-column:2;display:flex;flex-direction:column;gap:6px}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;flex:none}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.slow{font-size:.7rem;font-weight:700;color:var(--muted)}
.icon.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.icon.sm{width:34px;height:34px}
.icon.sm svg{width:16px;height:16px}

/* sound cards */
.sound{display:flex;flex-direction:column;gap:10px}
.sound-top{display:flex;align-items:center;gap:12px}
.sym{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;color:var(--accent);min-width:0}
.ipa{font-size:.85rem;color:var(--muted);font-weight:500}
.how{font-size:.95rem}
.vn{font-size:.9rem;color:var(--hint);font-weight:500}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.word .fr{font-size:1.05rem}
.word small{color:var(--muted);font-size:.75rem}
.playing{outline:2px solid var(--red)!important}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pair{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pair button{flex:1;border:0;background:none;padding:10px 6px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.pair button+button{border-left:1px solid var(--line)}
.pair button:active{background:var(--accent-soft)}

/* grammar */
.g h3{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:4px 0 0}
.g .txt{font-size:.98rem}
.g .txt b{color:var(--accent)}
.g .txt i{font-family:var(--display);font-style:normal;font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft)}
td.f{font-family:var(--display);font-weight:700;font-size:1.02rem}
tr.say{cursor:pointer}
tr.say:hover td{background:var(--accent-soft)}
tr.say td:last-child{width:1%;white-space:nowrap;color:var(--muted)}
.exs{display:flex;flex-direction:column;gap:6px}
.exr{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.exr span{display:flex;flex-direction:column;min-width:0}
.exr .fr{font-size:1.05rem}
.exr small{color:var(--muted)}
.trap{border:2px dashed var(--accent);background:var(--surface);border-radius:18px;padding:12px 14px;font-size:.93rem}
.trap b:first-child{color:var(--accent)}

.dlg{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);box-shadow:0 3px 0 var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.line{display:flex;flex-direction:column;max-width:86%;gap:2px}
.line.A{align-self:flex-start}
.line.B{align-self:flex-end;align-items:flex-end}
.who{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bubble{text-align:left;border-radius:16px;padding:10px 14px;background:var(--surface);border:1px solid var(--line)}
.B .bubble{background:var(--accent-soft);border-color:transparent}
.bubble .fr{font-size:1.1rem;display:block}
.bubble small{color:var(--muted)}
.bubble.hide .fr,.bubble.hide .rj{filter:blur(7px);user-select:none}
.rj{display:block;color:var(--hint);font-size:.82rem;font-weight:500}
.jp-sub{color:var(--accent);font-size:1.05rem;margin-top:-2px}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qask{font-size:.9rem;color:var(--muted)}
.qprompt{font-size:1.45rem;line-height:1.3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:500}
.opt.fr{font-size:1.08rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.fb{font-weight:600}
.fb.ok{color:var(--good)} .fb.no{color:var(--red)}
.explain{font-size:.92rem;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px}
.result{text-align:center;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.warn{background:var(--red-soft);border-radius:12px;padding:10px 14px;font-size:.9rem}
footer{color:var(--muted);font-size:.8rem;text-align:center}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.Lbig{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;width:52px;height:62px;font-size:1.9rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none}
.Lbig small{font-size:.85rem;font-weight:700;font-family:var(--body)}
.linfo{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.84rem;line-height:1.35}
.lname b{color:var(--red);font-size:.95rem}
.lsound{color:var(--muted)}
.lex{border:0;background:none;padding:0;text-align:left;margin-top:2px}
.lex .fr{font-size:1rem;text-decoration:underline dotted var(--accent);text-underline-offset:3px}
.lex small{color:var(--muted)}
table.grid th,table.grid td{padding:4px;text-align:center;border-bottom:0}
table.grid thead th{font-family:var(--display);font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--accent);background:none}
.syl{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:46px;padding:6px 4px;font-size:1rem}
.syl:hover{border-color:var(--accent)}
.rowbtn{border:0;background:var(--accent);color:var(--surface);border-radius:8px;padding:6px 8px;font-weight:700;font-family:var(--display);white-space:nowrap}
.splitrow{display:flex;flex-direction:column;gap:8px;padding:12px}
.chunks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chunk{border:0;background:var(--accent-soft);border-radius:8px;padding:4px 10px;font-size:1.1rem}
.dot{color:var(--muted)}
.whole{display:flex;gap:10px;align-items:center}
.whole>span{display:flex;flex-direction:column;min-width:0}
.whole .fr{font-size:1.1rem}
.whole small{color:var(--muted)}

/* ---------- v2: sakura + matcha app shell ---------- */
.kl{font-family:"Gowun Dodum","Noto Sans KR",var(--display);font-weight:700}
.wrap{padding-block:20px 112px}
header.hero{position:relative;background:linear-gradient(168deg,var(--hint-soft) 0%,var(--hint-soft) 55%,var(--accent-soft) 100%);box-shadow:0 4px 0 var(--shadow)}
.hero>*:not(.petals){position:relative;z-index:1}
.petals{position:absolute;inset:0;pointer-events:none;z-index:0}
.petals i{position:absolute;top:-14px;width:11px;height:9px;background:var(--petal);border-radius:80% 0 80% 0;opacity:.85;animation:fall 10s linear infinite}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0deg)}50%{transform:translate(18px,170px) rotate(160deg)}100%{transform:translate(-6px,360px) rotate(320deg);opacity:0}}
.pbar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--hint));transition:width .4s}
.hero-bar{margin-top:6px}
.card,.lesson,.quiz,.lhead,.seg,.tabs{box-shadow:0 3px 0 var(--shadow)}
.seg button[aria-selected="true"]{background:var(--hint-soft);color:var(--hint);box-shadow:inset 0 0 0 2px var(--hint)}
.seg.two{grid-template-columns:1fr 1fr}
.seg.two button{padding:10px 4px;font-size:1rem}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),#EE7C86)}
.daily{background:linear-gradient(120deg,var(--accent),#EE7C86)}
.daily.soft{background:var(--hint-soft);color:var(--ink);box-shadow:0 4px 0 var(--shadow)}
.daily.soft small{color:var(--muted);opacity:1}
.btn.matcha{background:var(--hint);border-color:var(--hint);color:var(--surface)}
.bar.center{justify-content:center}
.sec-h{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:6px 0 -6px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:6px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbar button{flex:1;max-width:160px;border:0;background:none;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--muted)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.tabbar .nv{font-size:1.25rem;line-height:22px;height:22px}
.tabbar button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
/* kana chart */
.kchart{padding:8px;overflow-x:auto}
.kchart table{width:100%;border-collapse:separate;border-spacing:5px}
.kchart th{background:none;color:var(--hint);font-family:var(--display);font-size:.9rem;text-transform:none;letter-spacing:0;padding:0;text-align:center;border:0;width:24px}
.kchart td{padding:0;border:0}
.kcell{width:100%;aspect-ratio:1/1.08;min-width:46px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;line-height:1}
.kcell .kl{font-size:1.75rem}
.kcell small{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:3px}
.kcell:hover{border-color:var(--accent);background:var(--accent-soft)}
.kcell.done{background:var(--hint-soft);border-color:var(--hint)}
.kcell.done::after{content:"✓";position:absolute;top:3px;right:5px;font-size:.62rem;color:var(--hint);font-weight:800}
.progress{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.progress .pbar{background:var(--line)}
.pg-row{display:flex;justify-content:space-between;font-size:.9rem}
.pg-row span{color:var(--hint);font-weight:700}
.confuse{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

 {fr:"가요 · 먹어요", vi:"Đuôi câu lịch sự -아요/어요", b:[

   TB(["Động từ","-아요/어요","Nghĩa"],[["가다","가요","đi"],["오다","와요","đến"],["먹다","먹어요","ăn"],["마시다","마셔요","uống"],["보다","봐요","xem"],["읽다","읽어요","đọc"],["하다","해요","làm"],["좋아하다","좋아해요","thích"]],[1]),
   EX([["저는 학교에 가요.","Tôi đi học."],["밥을 먹어요.","Tôi ăn cơm."],["매일 한국어를 공부해요.","Ngày nào tôi cũng học tiếng Hàn."],["뭐 해요?","Bạn đang làm gì?"]]),
   TRAP("<b>Bẫy:</b> Cùng một câu 가요 có thể là “tôi đi”, “bạn đi không?” hay “đi thôi”. Ngữ cảnh và ngữ điệu quyết định nghĩa.")],
  q:[["가다 → ___",["가요","가어요","가아요"],0,"ㅏ + 아요 gộp → 가요."],["먹다 → ___",["먹어요","먹아요","먹요"],0,"ㅓ → 어요."],["하다 → ___",["해요","하요","하어요"],0,"하다 → 해요."],["오다 → ___",["와요","오아요","오요"],0,"오 + 아요 → 와요."],["마시다 → ___",["마셔요","마시요","마시아요"],0,"시 + 어요 → 셔요."],["보다 → ___",["봐요","보요","보어요"],0,"보 + 아요 → 봐요."],["공부하다 → ___",["공부해요","공부하요","공부아요"],0,"하다 → 해요."],["살다 → ___",["살아요","살어요","사요"],0,"ㅏ → 아요."]]},

 {fr:"안 · 못", vi:"Câu phủ định: không, không thể", b:[

function strokeLayer(ch,mode){
  const s=strokesOf(ch); if(!s)return "";
  const all=s.base.map(d=>({d,base:1})).concat(s.extra.map(d=>({d,base:0})));
  const tf=s.extra.length?' transform="translate(0 8) scale(.86)"':"";
  let g1="",g2="",labels="";
  const placed=[];
  all.forEach((x,i)=>{
    const m=x.d.match(/M\s*([\d.]+)[ ,]+([\d.]+)/);let lx=+m[1],ly=+m[2];
    if(x.base&&tf){lx=lx*.86;ly=ly*.86+8;}
    while(placed.some(p=>Math.hypot(p[0]-lx,p[1]-ly)<9)){lx+=8;ly+=3;}
    placed.push([lx,ly]);
    const col=STC[i%4];
    const path=`<path d="${x.d}" pathLength="1" class="${mode==="ghost"?"gs":"st"}" data-i="${i}" style="${mode==="ghost"?"":`stroke:${col}`}"/>`;
    if(x.base)g1+=path;else g2+=path;
    if(mode!=="ghost")labels+=`<g class="lbl" data-i="${i}"><circle cx="${lx}" cy="${ly}" r="5.4" style="fill:${col}"/><text x="${lx}" y="${ly+2.4}">${i+1}</text></g>`;
    else labels+=`<text class="gnum" x="${lx+5}" y="${ly-3}">${i+1}</text>`;
  });
  return `<g${tf}>${g1}</g>${g2}${labels}`;
}
function strokeCount(ch){const s=strokesOf(ch);return s?s.base.length+s.extra.length:0;}

function animate(svg,slow){
  const tok=++animToken;
  const paths=[...svg.querySelectorAll("path.st")],lbls=[...svg.querySelectorAll(".lbl")];
  paths.forEach(p=>{p.getAnimations&&p.getAnimations().forEach(a=>a.cancel());p.style.strokeDashoffset="1";p.style.opacity="0";});
  lbls.forEach(l=>l.style.opacity="0");
  if(reduceMotion()||!paths[0]||!paths[0].animate){paths.forEach(p=>{p.style.strokeDashoffset="0";p.style.opacity="1";});lbls.forEach(l=>l.style.opacity="1");return;}
  let i=0;
  const step=()=>{
    if(tok!==animToken||i>=paths.length)return;
    const p=paths[i];p.style.opacity="1";if(lbls[i])lbls[i].style.opacity="1";
    let len=60;try{len=p.getTotalLength();}catch(e){}
    const a=p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:Math.max(380,len*(slow?16:8)),easing:"ease-in-out",fill:"forwards"});
    a.onfinish=()=>{p.style.strokeDashoffset="0";i++;setTimeout(step,slow?260:140);};
  };
  step();
}

const NOVELTY_RE=/eddy|\bflo\b|grandma|grandpa|\breed\b|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|kathy|\bfred\b|ralph/i;
const OLD_RE=/grandma|grandpa/i;
const MALE_RE=/thomas|henri|\bpaul\b|claude|daniel|nicolas|jacques|antoine|\bjean\b|r[ée]my|mathieu|louis|fabrice|alain|guillaume|g[ée]rard|\byves\b|otoya|hattori|ichiro|keita|daichi|naoki|minsu|injoon|hyunsu|bongjin|gookmin|jinho|eddy|\breed\b|rocko|grandpa|\bmale\b|homme|男性/i;
const FEMALE_RE=/am[ée]lie|audrey|aur[ée]lie|marie|virginie|julie|hortense|denise|c[ée]line|chantal|[ée]lo[iï]se|brigitte|vivienne|jos[ée]phine|juliette|charlotte|coralie|ariane|sylvie|yvette|jacqueline|google|kyoko|o-?ren|haruka|ayumi|sayaka|nanami|mayu|\baoi\b|shiori|yuna|sora|sunhi|heami|seoyeon|jimin|yujin|\bflo\b|sandy|shelley|grandma|female|femme|女性/i;
const vGender=v=>FEMALE_RE.test(v.name)?"f":MALE_RE.test(v.name)?"m":"?";
const vRank=v=>(OLD_RE.test(v.name)?20:NOVELTY_RE.test(v.name)?10:0)+(/^ko[-_]KR/i.test(v.lang)?0:3)+(/premium|enhanced|n[âa]ng cao|natural/i.test(v.name)?-1:0);
function langVoices(){if(!hasTTS)return [];return speechSynthesis.getVoices().filter(x=>/^ko/i.test(x.lang)).sort((a,b)=>vRank(a)-vRank(b));}
function voicePick(){
  const vs=langVoices();
  if(S.voiceName){const v=vs.find(x=>x.name===S.voiceName);if(v)return {v,p:1,fake:false};}
  const want=S.voice==="m"?"m":"f";
  const hit=vs.find(v=>vGender(v)===want&&!OLD_RE.test(v.name));
  if(hit)return {v:hit,p:1,fake:false};
  const base=vs.find(v=>vGender(v)==="?"&&!NOVELTY_RE.test(v.name))||vs.find(v=>!NOVELTY_RE.test(v.name))||vs[0]||null;
  if(!base)return {v:null,p:want==="m"?.7:1.15,fake:true};
  const g=vGender(base);
  return {v:base,p:want==="m"?(g==="m"?1:.7):(g==="f"?1:1.3),fake:g!==want};
}

function speak(t,rate,onend){

function speakSeq(list,rate,els){

}

/* ===================== QUIZ BUILDERS ===================== */
function qComm(i,A){
  A=A||L;const l=A[i],pool=l.p,allP=A.flatMap(x=>x.p),allB=A.flatMap(x=>x.d.filter(d=>d[0]==="B"));
  const replies=[];l.d.forEach((x,k)=>{const n=l.d[k+1];if(x[0]==="A"&&n&&n[0]==="B")replies.push({q:x,a:n});});
  const used=new Set();
  const pickP=()=>{const c=shuffle(pool).find(p=>!used.has(p[0]))||rnd(pool);used.add(c[0]);return c;};
  const dis=(right,f)=>{const seen=new Set([right[f]]),out=[];for(const x of shuffle(pool).concat(shuffle(allP))){if(!seen.has(x[f])){seen.add(x[f]);out.push(x[f]);}if(out.length===3)break;}return out;};
  return shuffle(["listen","listen","vi2fr","vi2fr","fr2vi","fr2vi","reply","reply"]).map(t=>{
    if(t==="reply"&&replies.length){const r=rnd(replies);const seen=new Set([r.a[1]]),o=[];for(const x of shuffle(allB)){if(!seen.has(x[1])){seen.add(x[1]);o.push(x[1]);}if(o.length===3)break;}
      return {ask:"Người ta nói câu này. Bạn đáp sao cho hợp?",prompt:r.q[1],promptFr:true,sub:r.q[2],speakText:r.q[1],ans:r.a[1],opts:shuffle([r.a[1],...o]),fr:true,after:r.a[1]};}
    if(t==="listen"&&hasTTS){const p=pickP();return {ask:"Nghe rồi chọn nghĩa đúng",listen:true,speakText:p[0],reveal:p[0],ans:p[2],opts:shuffle([p[2],...dis(p,2)])};}
    if(t==="fr2vi"){const p=pickP();return {ask:"Câu này nghĩa là gì?",prompt:p[0],promptFr:true,speakText:p[0],ans:p[2],opts:shuffle([p[2],...dis(p,2)])};}
    const p=pickP();return {ask:"Nói câu này bằng tiếng Hàn thế nào?",prompt:p[2],ans:p[0],opts:shuffle([p[0],...dis(p,0)]),fr:true,after:p[0]};
  });
}
function qSound(i){
  const l=P[i],qs=[];
  const words=l.items.flatMap((it,k)=>it.w.map(w=>({w:w[0],k})));
  // listen & pick between a confusing pair
  for(const p of shuffle(l.pairs).slice(0,5)){const a=rnd(p);
    qs.push({ask:"Nghe kỹ. Người ta vừa đọc từ nào?",listen:true,speakText:a,ans:a,opts:shuffle(p.slice()),fr:true,reveal:null,explain:`Hai từ: <b>${esc(p[0])}</b> và <b>${esc(p[1])}</b>. Bấm loa để nghe lại.`});}
  // listen & pick spelling among 4 words
  for(let n=0;n<2;n++){const a=rnd(words);const o=shuffle(words.filter(x=>x.w!==a.w)).slice(0,3).map(x=>x.w);
    qs.push({ask:"Nghe rồi chọn từ đúng",listen:true,speakText:a.w,ans:a.w,opts:shuffle([a.w,...o]),fr:true});}
  // which sound (not alphabet)
  if(!l.alpha&&l.items.length>1){const a=rnd(words);const right=l.items[a.k].sym;const o=shuffle(l.items.filter((_,k)=>k!==a.k).map(x=>x.sym)).slice(0,2);
    qs.push({ask:"Từ này chứa âm nào trong bài?",prompt:a.w,promptFr:true,speakText:a.w,ans:right,opts:shuffle([right,...o]),fr:true,explain:esc(l.items[a.k].how)});}
  while(qs.length<8){const a=rnd(words);const o=shuffle(words.filter(x=>x.w!==a.w)).slice(0,3).map(x=>x.w);
    qs.push({ask:"Nghe rồi chọn từ đúng",listen:true,speakText:a.w,ans:a.w,opts:shuffle([a.w,...o]),fr:true});}
  if(!hasTTS) return qs.filter(q=>!q.listen).concat(gFallback(l)).slice(0,8);
  return shuffle(qs).slice(0,8);
}
function gFallback(l){ // no audio: read word -> which sound
  const words=l.items.flatMap((it,k)=>it.w.map(w=>({w:w[0],k})));
  return Array.from({length:8},()=>{const a=rnd(words);const right=l.items[a.k].sym;const o=shuffle(l.items.filter((_,k)=>k!==a.k).map(x=>x.sym)).slice(0,3);
    return {ask:"Từ này thuộc nhóm âm nào?",prompt:a.w,promptFr:true,ans:right,opts:shuffle([right,...o]),fr:true,explain:esc(l.items[a.k].how)};});
}
function qGram(i,A){return qGramL((A||G)[i]);}
function qGramL(l){
  return shuffle(l.q).map(x=>{
    if(Array.isArray(x)){const [s,o,a,e]=x;const ans=o[a];
      const full=s.replace(/\(.*?\)/g,"").replace("___",ans).replace(/' /g,"'");
      return {ask:"Chọn đáp án đúng để điền vào chỗ trống",prompt:s,blank:true,promptFr:true,ans,opts:shuffle(o.slice()),fr:true,after:/[\uac00-\ud7a3]/.test(full)?full.replace(/[（(][^)）]*[)）]/g,""):null,explain:esc(e)};}
    return {ask:x.ask,ans:x.o[x.a],opts:shuffle(x.o.slice()),fr:/[\uac00-\ud7a3]/.test(x.o[x.a]),after:/[\uac00-\ud7a3]/.test(x.o[x.a])?x.o[x.a]:null,explain:esc(x.e)};
  });
}

function qFound(i){
  const l=N[i],b=l.b,gens=[];
  const letters=b.filter(x=>x.letters).flatMap(x=>x.letters);
  const words=b.filter(x=>x.items).flatMap(x=>x.items.flatMap(it=>it.w.map(w=>w[0])));
  const pairs=b.filter(x=>x.pairs).flatMap(x=>x.pairs);
  const grids=b.filter(x=>x.grid).flatMap(x=>x.grid.rows).map(([r,c])=>[r,c.filter(Boolean)]).filter(r=>r[1].length>=2);
  const splits=b.filter(x=>x.split).flatMap(x=>x.split);
  const four=(arr,right)=>shuffle([right,...shuffle([...new Set(arr)].filter(x=>x!==right)).slice(0,3)]);
  if(letters.length){
    gens.push({a:1,f:()=>{const x=rnd(letters);return {ask:"Nghe rồi chọn chữ đúng",listen:true,speakText:x[0],rate:.7,ans:x[0],opts:four(letters.map(y=>y[0]),x[0]),fr:true};}});
    gens.push({f:()=>{const x=rnd(letters);return {ask:"Chữ này đọc là gì?",prompt:x[0],promptFr:true,ans:x[1],opts:four(letters.map(y=>y[1]),x[1]),after:x[0]};}});
    const ex=letters.map(y=>y[3]);gens.push({a:1,f:()=>{const w=rnd(ex);return {ask:"Nghe rồi chọn từ đúng",listen:true,speakText:w,rate:.8,ans:w,opts:four(ex,w),fr:true};}});gens.push({f:()=>{const x=rnd(letters);return {ask:"Từ này đọc thế nào?",prompt:x[3],promptFr:true,speakText:x[3],ans:x[4].split(" · ")[0],opts:four(letters.map(y=>y[4].split(" · ")[0]),x[4].split(" · ")[0])};}});
  }
  if(words.length>=4)gens.push({a:1,f:()=>{const w=rnd(words);return {ask:"Nghe rồi chọn từ đúng",listen:true,speakText:w,ans:w,opts:four(words,w),fr:true};}});
  const its=b.filter(x=>x.items).flatMap(x=>x.items);
  if(its.length>1)gens.push({f:()=>{const k=Math.random()*its.length|0,w=rnd(its[k].w)[0];const right=its[k].sym;return {ask:"Từ này thuộc nhóm âm nào trong bài?",prompt:w,promptFr:true,speakText:w,ans:right,opts:four(its.map(x=>x.sym),right),fr:true,explain:esc(its[k].how)};}});
  if(pairs.length)gens.push({a:1,f:()=>{const p=rnd(pairs),a=rnd(p);return {ask:"Nghe kỹ. Người ta vừa đọc từ nào?",listen:true,speakText:a,ans:a,opts:shuffle(p.slice()),fr:true};}});
  if(grids.length)gens.push({a:1,f:()=>{const r=rnd(grids),c=rnd(r[1]);return {ask:"Nghe rồi chọn âm đúng",listen:true,speakText:c,rate:.7,ans:c,opts:four(r[1],c),fr:true};}},{a:1,f:()=>{const r=rnd(grids),c=rnd(r[1]);return {ask:"Nghe rồi chọn âm đúng",listen:true,speakText:c,rate:.7,ans:c,opts:four(r[1],c),fr:true};}});
  if(splits.length&&!l.sentences){
    gens.push({f:()=>{const s=rnd(splits);const n=String(s[0].length);const o=shuffle(["1","2","3","4","5"].filter(x=>x!==n)).slice(0,2);return {ask:"Từ này có mấy âm tiết (mấy khúc đọc)?",prompt:s[1],promptFr:true,speakText:s[1],ans:n,opts:[n,...o].sort(),explain:"Chia ra: <b>"+esc(s[0].join(" · "))+"</b>"};}});
    gens.push({a:1,f:()=>{const s=rnd(splits);return {ask:"Nghe rồi chọn từ đúng",listen:true,speakText:s[1],ans:s[1],opts:four(splits.map(x=>x[1]),s[1]),fr:true};}});
  }
  if(l.sentences){
    gens.push({a:1,f:()=>{const s=rnd(splits);return {ask:"Nghe câu rồi chọn câu đúng",listen:true,speakText:s[1],ans:s[1],opts:four(splits.map(x=>x[1]),s[1]),fr:true};}});
    gens.push({f:()=>{const s=rnd(splits);return {ask:"Câu này nghĩa là gì?",prompt:s[1],promptFr:true,speakText:s[1],ans:s[2],opts:four(splits.map(x=>x[2]),s[2])};}});
  }
  const g=shuffle(hasTTS?gens:gens.filter(x=>!x.a));
  const qs=[],seen=new Set();let k=0,tries=0;
  while(qs.length<8&&g.length&&tries<60){const q=g[k%g.length].f();k++;tries++;const id=q.ask+q.ans;if(seen.has(id)&&tries<50)continue;seen.add(id);qs.push(q);}
  return shuffle(qs);
}
const QB={n:i=>N[i].q?qGramL(N[i]):qFound(i),s:qSound,g:qGram,c:qComm,h:i=>qGram(i,G3),d:i=>qComm(i,C3),j:i=>qGram(i,G4),e:i=>qComm(i,C4),k:i=>qGram(i,G5),f:i=>qComm(i,C5)};

/* ===================== QUIZ UI ===================== */
function quiz(el,qs,key){
  let n=0,score=0;const N=qs.length;
  const draw=()=>{
    if(n>=N)return finish();
    const q=qs[n];
    const prompt=q.blank?esc(q.prompt).replace("___",'<span class="blank">?</span>'):esc(q.prompt||"");
    el.innerHTML=`<div class="quiz">
      <div class="qtop"><span>Câu ${n+1}/${N}</span><span>Đúng ${score}</span></div>
      <div class="prog"><i style="width:${n/N*100}%"></i></div>
      <p class="qask">${q.ask}</p>
      ${q.listen?`<div class="bar"><button class="icon on" id="play" aria-label="Nghe lại">${ICON}</button><button class="icon slow" id="playS" aria-label="Nghe chậm">chậm</button></div>`:
        (q.prompt?`<p class="qprompt ${q.promptFr?"fr":""}"><span>${prompt}</span>${q.speakText?`<button class="icon sm" id="play" aria-label="Nghe">${ICON}</button>`:""}</p>`:"")}
      ${q.blank&&RJon()&&rj(q.prompt)?`<p class="qrj">${esc(rj(q.prompt).replace(/_+/g,"___"))}</p>`:""}${q.sub?`<p class="note">${esc(q.sub)}</p>`:""}
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${q.fr?"fr":""}" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <div id="fbx" class="stack"></div></div>`;
    const pl=document.getElementById("play"),ps=document.getElementById("playS");
    if(pl)pl.onclick=()=>speak(q.speakText,q.rate||.85);
    if(ps)ps.onclick=()=>speak(q.speakText,.55);
    if(q.listen)setTimeout(()=>speak(q.speakText,q.rate||.85),250);
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=q.opts[b.dataset.k]===q.ans;if(ok)score++;
      el.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[x.dataset.k]===q.ans)x.classList.add("right");});
      if(!ok)b.classList.add("wrong");
      if(q.blank){const bl=el.querySelector(".blank");if(bl)bl.textContent=q.ans;}
      const fbx=document.getElementById("fbx");
      fbx.innerHTML=`<p class="fb ${ok?"ok":"no"}">${ok?"Chuẩn!":"Chưa đúng."} ${q.reveal?`Câu vừa nghe: <span class="fr">${esc(q.reveal)}</span>`:""}</p>
        ${q.explain?`<p class="explain">${q.explain}</p>`:""}
        <button class="btn primary" id="nq">${n+1<N?"Câu tiếp →":"Xem kết quả"}</button>`;
      if(q.after)speak(q.after,.85);else if(!ok&&q.listen)speak(q.speakText,.7);
      const nb=document.getElementById("nq");nb.onclick=()=>{n++;draw();};nb.focus({preventScroll:true});
    });
  };
  const finish=()=>{
    markDay();
    const pass=score>=Math.ceil(N*.75);
    if(key){S.best[key]=Math.max(S.best[key]||0,score);if(pass)S.done[key]=true;save();}
    const msg=score===N?"Hoàn hảo. Lười mà giỏi ghê.":pass?"Qua bài rồi! Mai ôn lại 5 phút là nhớ lâu.":"Gần được rồi. Xem lại phần bài học một lượt rồi thử lại nha.";
    let nextBtn="";
    if(key&&pass){const tr=key[0],i=+key.slice(1);if(i+1<TRACKS[tr].data.length)nextBtn=`<button class="btn primary" id="next">Bài ${i+2} →</button>`;}
    el.innerHTML=`<div class="quiz result">
      ${ill(pass?"sakura":"onigiri",88)}<span class="big">${score}/${N}</span><p class="fb ${pass?"ok":"no"}">${msg}</p>
      <div class="bar" style="justify-content:center"><button class="btn" id="again">Làm lại</button>${nextBtn||'<button class="btn primary" id="home">Về danh sách</button>'}</div></div>`;
    document.getElementById("again").onclick=()=>key?open(key[0],+key.slice(1),"q"):review();
    const nx=document.getElementById("next"),hm=document.getElementById("home");
    if(nx)nx.onclick=()=>open(key[0],+key.slice(1)+1);
    if(hm)hm.onclick=()=>{if(key)S.track=key[0];home();};
  };
  draw();
}

function review(){
  setNav("review");
  if(hasTTS)speechSynthesis.cancel();

/* ===================== PHIÊN ÂM LATIN tự động (Revised Romanization, có luật nối âm cơ bản) ===================== */
const RR_CHO=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const RR_JUNG=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
// jong index → [đọc khi đứng cuối, phụ âm đầu khi nối sang (chỉ số cho), phần còn ở lại khi nối (jong đơn hoặc -1)]
const JONG_FINAL=["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
const JONG_LINK=[null,0,1,9,2,12,2,3,5,0,6,7,9,16,17,5,6,7,9,9,10,null,12,14,15,16,17,null];
const JONG_STAY=[0,0,0,1,0,4,0,0,0,8,8,8,8,8,8,0,0,0,17,0,0,21,0,0,0,0,0,0];
function rjDecomp(ch){const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;return {cho:Math.floor(c/588),jung:Math.floor(c%588/28),jong:c%28};}
function rjWord(w){
  const sy=[...w].map(ch=>{const d=rjDecomp(ch);return d?Object.assign({ch},d):{ch,raw:true};});
  for(let i=0;i<sy.length-1;i++){
    const a=sy[i],b=sy[i+1];if(a.raw||b.raw||!a.jong)continue;
    if(b.cho===11){ // nối âm vào ㅇ
      if(a.jong===27){a.jong=0;continue;} // ㅎ câm
      if(a.jong===21)continue; // ㅇ giữ nguyên
      b.cho=JONG_LINK[a.jong];a.jong=JONG_STAY[a.jong];continue;
    }
    if(b.cho===18&&[1,7,17,22,19].includes(a.jong)){ // bật hơi: k/t/p/j + ㅎ
      b.cho={1:15,7:16,17:17,22:14,19:16}[a.jong];a.jong=0;continue;}
    if(a.jong===27&&[0,3,12].includes(b.cho)){b.cho={0:15,3:16,12:14}[b.cho];a.jong=0;continue;}
    const f=JONG_FINAL[a.jong];
    if((b.cho===2||b.cho===6)){ // biến âm mũi
      if(f==="p")a.jong=16; else if(f==="k")a.jong=21; else if(f==="t")a.jong=4;
      if(a.jong===8&&b.cho===2)b.cho=5;
      continue;}
    if(a.jong===4&&b.cho===5){a.jong=8;continue;} // ㄴ+ㄹ → ㄹㄹ
    if(a.jong===8&&b.cho===2){b.cho=5;continue;}  // ㄹ+ㄴ → ㄹㄹ
    if((a.jong===16||a.jong===21)&&b.cho===5){b.cho=2;continue;} // ㅁ/ㅇ + ㄹ → ㄴ
  }
  let out="";
  sy.forEach((s,i)=>{
    if(s.raw){out+=s.ch;return;}
    let c=RR_CHO[s.cho];
    if(s.cho===5){const p=sy[i-1];c=(p&&!p.raw&&p.jong===8)?"l":"r";}
    out+=c+RR_JUNG[s.jung]+(s.jong?JONG_FINAL[s.jong]:"");
  });
  return out;
}
function rj(text){
  text=String(text);

  return text.split(/(\s+)/).map(w=>/^\s+$/.test(w)?" ":w.replace(/[가-힣]+/g,m=>rjWord(m))).join("").replace(/\s{2,}/g," ").trim();
}

  }else gate();
}
bootCode();
